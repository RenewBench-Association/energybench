# Documentation site, built with Zensical (https://zensical.org) and hosted on
# Read the Docs, which builds one version per release tag plus "latest" (main).
#   uv run zensical serve      # live preview at http://localhost:8000
[project]
site_name = "energybench"
site_description = "Python client for EnergyBench: search open energy and weather data and load it lazily."
site_url = "https://energybench.readthedocs.io/en/stable/"
site_author = "RenewBench Association"
copyright = "Copyright &copy; 2026 RenewBench Association"
repo_url = "https://github.com/RenewBench-Association/energybench"
repo_name = "RenewBench-Association/energybench"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "API reference" = "reference/api.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
# docs/stylesheets/brand.css swaps this for the white mark in dark mode.
logo = "assets/logo/energybench-e-light.svg"
# This favicon switches between its light and dark colors by itself.
favicon = "assets/logo/favicon.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
