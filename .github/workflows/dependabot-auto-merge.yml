name: Dependabot auto-merge

# Minor and patch updates merge themselves once every required check passes.
# Major updates wait for a human. The merge uses the release App's token so
# the resulting push to main triggers workflows (GITHUB_TOKEN pushes do not).
on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'RenewBench-Association/energybench'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the pull request's commits
      pull-requests: read # read the pull request's metadata
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        id: app-token
        with:
          # Dependabot secrets: a separate store that only Dependabot-triggered
          # runs can read, so an environment adds nothing here.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write
      - name: Squash-merge once the checks pass
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
