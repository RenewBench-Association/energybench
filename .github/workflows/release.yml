name: Release

# Releases happen only when a core-team member pushes to the `release`
# branch, never on ordinary pushes to main. See RELEASE.md. Each push does
# one of two things, decided by the gate job before anything is created:
#
#   prepare  git push origin main:release
#            release-please opens or updates the release PR on main with the
#            new version and CHANGELOG.md entry. Nothing is published.
#   publish  after merging the release PR and passing release-test on the
#            merged release commit: git push origin <release commit>:release
#            release-please tags that commit and creates a *draft* GitHub
#            Release with the CHANGELOG.md entry as its notes. The jobs below
#            build the tag, upload it to PyPI, attach the same files to the
#            draft and only then publish it. Read the Docs builds the new docs
#            version from the tag; Zenodo mints a DOI on publication.
on:
  push:
    branches: [release]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: Decide and check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # look up release-test runs for this commit
      contents: read # read the manifest, its history and existing tags
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every check happens here, before release-please creates anything.
      #   prepare: the manifest's version is already tagged (or is the 0.0.0
      #            placeholder), so release-please only opens or updates the
      #            release PR.
      #   publish: a merged release PR set a version that has no tag yet. The
      #            pushed commit must be that release commit itself, and the
      #            release test must have passed on it.
      - name: Decide whether this push prepares or publishes
        id: decide
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          if [ "$version" = "0.0.0" ] || \
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already released, so this push prepares the next release PR."
            echo "mode=prepare" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits?path=.release-please-manifest.json&sha=$GITHUB_SHA&per_page=1" \
            --jq '.[0].sha')"
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo "::error::v$version must be published from its release commit $release_sha, but $GITHUB_SHA was pushed. Run: git push origin $release_sha:release-test, wait for it to pass, then git push origin $release_sha:release"
            exit 1
          fi

          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-test.yml/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq '.total_count')"
          if [ "$passed" -eq 0 ]; then
            echo "::error::The release test has not passed on $GITHUB_SHA yet. Run: git push origin $GITHUB_SHA:release-test, wait for it to pass, then re-run this workflow run (Re-run all jobs). Pushing to release again does nothing, because the branch already points at this commit."
            exit 1
          fi
          echo "The release test passed on $GITHUB_SHA, so v$version will be published."
          echo "mode=publish" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  release-please:
    name: release-please (${{ needs.gate.outputs.mode }})
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's credentials are secrets of this environment, which only the
    # release branch may deploy to, so no other workflow run can read them.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN: pull requests opened with
      # GITHUB_TOKEN never trigger CI, so the release PR could not pass its
      # required checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Release PRs and tags always live on main; the release branch is
          # only the trigger.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Each push does exactly one of the two things the gate decided.
          skip-github-release: ${{ needs.gate.outputs.mode == 'prepare' }}
          skip-github-pull-request: ${{ needs.gate.outputs.mode == 'publish' }}

  build:
    name: Build release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # GitHub build provenance for the dists
      contents: read # clone the repository
      id-token: write # sign the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: "true"

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/energybench/
    permissions:
      id-token: write # Trusted Publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Publish GitHub Release
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets and publish the draft
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      # Files are attached while the release is still a draft, so this also
      # works with immutable releases, which freeze assets on publication.
      - name: Attach the PyPI files and publish the draft
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
