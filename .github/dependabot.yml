# Updates never trigger a release: every prefix is chore/ci, which
# release-please hides. Minor and patch updates auto-merge once CI is green
# (see workflows/dependabot-auto-merge.yml); majors arrive as their own PRs.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A library must not raise its users' minimum versions just because a
    # newer release exists, so only uv.lock is updated. The lowest-direct CI
    # job keeps proving the declared floors.
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      hooks-minor-and-patch:
        update-types: [minor, patch]
