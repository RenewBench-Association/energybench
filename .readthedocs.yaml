# Read the Docs builds every release tag as its own version, plus "latest"
# from main and a preview for every pull request. Dependencies come from the
# locked "docs" group in uv.lock. uv itself is pinned too, so rebuilding an old
# version of the docs gives the same result; raise it together with uv_build.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.13.1
      - asdf global uv 0.13.1
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --no-default-groups --group docs
    build:
      html:
        - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv run --no-sync zensical build --strict
    post_build:
      - mkdir -p "${READTHEDOCS_OUTPUT}/html/"
      - cp --recursive site/* "${READTHEDOCS_OUTPUT}/html/"
